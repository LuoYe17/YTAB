name: 想法 / 功能
description: 新功能或改进建议
title: "[idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 粗略想法
      description: 交互或行为即可，不必先写实现细节
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: 其它（可选）
      description: 参考产品、约束、是否愿意自己提 PR 等
